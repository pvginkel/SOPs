# Builds the site and publishes it to GitHub Pages.
#
# The Ansible runbooks are mirrored at build time, so the site is only as fresh as its last build:
# every push here, once a day for the runbooks, or by hand (Actions > Publish > Run workflow).
name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pvginkel/Ansible
          path: _ansible
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pipx install poetry && poetry install --no-interaction
      - run: poetry run python site/build.py --ansible _ansible --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
